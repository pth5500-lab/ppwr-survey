<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAK PPWR 제출자료 관리</title>
<style>
:root{--navy:#173b66;--line:#d9e0e8;--bg:#f5f7fa;--red:#b42318;--green:#067647}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:#172b4d}
.wrap{max-width:1500px;margin:auto;padding:24px}.head{margin-bottom:18px}.head h1{margin:0;color:var(--navy);font-size:27px}.head p{margin:6px 0;color:#667085}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:15px 0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--navy)}.stat span{font-size:12px;color:#667085}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;min-width:150px}.toolbar input{flex:1;min-width:240px}
button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:var(--navy);color:white}.secondary{background:#eef2f6;color:#173b66}.danger{background:#fee4e2;color:#b42318}
.status{font-size:12px;color:#667085;margin:8px 0}.tablebox{overflow:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:10px;border-bottom:1px solid #e7ebf0;text-align:left;vertical-align:top;font-size:13px}th{background:#f8fafc;position:sticky;top:0;z-index:1}.mono{font-family:monospace}.muted{font-size:11px;color:#667085}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#dcfae6;color:#067647}.bad{background:#fee4e2;color:#b42318}.neutral{background:#f2f4f7;color:#475467}
.detail{display:none;background:#fbfcfe;padding:14px}.detail.open{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid #e4e7ec;background:#fff;border-radius:10px;padding:12px}.section h3{margin:0 0 9px;font-size:14px;color:var(--navy)}.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 10px;font-size:12px}.kv b{color:#475467}
.files{display:grid;gap:6px}.file{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #e4e7ec;border-radius:7px;padding:7px}
.review textarea{width:100%;min-height:70px;padding:8px;border:1px solid #cbd5e1;border-radius:7px;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;padding:20px;overflow:auto}.modal.open{display:block}.modalbox{max-width:1050px;margin:auto;background:var(--bg);border-radius:14px;overflow:hidden}.modalhead{background:var(--navy);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:19px}.formbody{padding:16px}.formcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}.formcard h3{margin:0 0 12px;color:var(--navy)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid label{font-size:12px;font-weight:700}.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin-top:4px}.formgrid textarea{min-height:70px}.matrow{display:grid;grid-template-columns:1.3fr 1fr .8fr .8fr 1fr auto;gap:6px;margin-bottom:6px}.matrow input{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px}.actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.formgrid{grid-template-columns:1fr}.matrow{grid-template-columns:1fr 1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><h1>PPWR 제출자료 관리</h1><p>Toray Advanced Materials Korea Inc. · Purchasing Planning Team</p></div>
 <div class="stats">
  <div class="card stat"><b id="total">-</b><span>전체 제출건수</span></div>
  <div class="card stat"><b id="companies">-</b><span>협력사 수</span></div>
  <div class="card stat"><b id="hmOk">-</b><span>중금속 적합</span></div>
  <div class="card stat"><b id="hmBad">-</b><span>중금속 부적합</span></div>
  <div class="card stat"><b id="reviewPending">-</b><span>적합성 미검증</span></div>
  <div class="card stat"><b id="reviewOk">-</b><span>적합성 적합</span></div>
  <div class="card stat"><b id="reviewReject">-</b><span>적합성 반려</span></div>
 </div>
 <div class="card toolbar">
  <input id="search" placeholder="회사명, 품목군, 품번, 접수번호 검색">
  <select id="hmFilter"><option value="">중금속 전체</option><option>적합</option><option>부적합</option><option value="미입력">미입력</option></select>
  <select id="reviewFilter"><option value="">적합성 검증 전체</option><option value="미검증">미검증</option><option>적합</option><option>반려</option></select>
  <button id="refresh" class="secondary">새로고침</button>
  <button id="csv" class="secondary">CSV 다운로드</button>
  <button id="deleteSelected" class="danger">선택 삭제</button>
 </div>
 <div id="status" class="status">불러오는 중...</div>
 <div class="card tablebox"><table>
  <thead><tr><th><input id="checkAll" type="checkbox"></th><th>접수번호</th><th>협력사</th><th>품목군</th><th>대표 규격 / 품번</th><th>중금속</th><th>PFAS</th><th>적합성 검증</th><th>첨부</th><th>관리</th></tr></thead>
  <tbody id="tbody"></tbody>
 </table></div>
</div>

<div id="editModal" class="modal"><div class="modalbox">
 <div class="modalhead"><h2>제출자료 수정</h2><button id="closeEdit">닫기</button></div>
 <div class="formbody">
  <div class="formcard"><h3>1. 협력사 정보</h3><div class="formgrid">
   <label>업체명<input id="eCompany"></label><label>담당자<input id="eContact"></label>
   <label>이메일<input id="eEmail"></label><label>연락처<input id="ePhone"></label>
  </div></div>
  <div class="formcard"><h3>2. 품목군</h3><div class="formgrid">
   <label>대분류<input id="eMajor"></label><label>세부 품목군<input id="eType"></label>
  </div></div>
  <div class="formcard"><h3>3. 대표 규격 및 품번</h3><div class="formgrid">
   <label>대표 규격<input id="eSpec" placeholder="예: 1,000 × 1,200 mm"></label>
   <label>대표 품번<input id="eCode" placeholder="예: EBG01001"></label>
  </div></div>
  <div class="formcard"><h3>4. 실제 구성재질</h3><div id="materialEditor"></div><button id="addMaterial" class="secondary">+ 재질 추가</button></div>
  <div class="formcard"><h3>5. 규제물질</h3><div class="formgrid">
   <label>Pb (mg/kg)<input id="ePb" type="number" step="0.001"></label><label>Cd (mg/kg)<input id="eCd" type="number" step="0.001"></label>
   <label>Hg (mg/kg)<input id="eHg" type="number" step="0.001"></label><label>CrVI (mg/kg)<input id="eCr" type="number" step="0.001"></label>
   <label>PFAS 적용<input id="ePfasApplicable"></label><label>PFAS Total (mg/kg)<input id="ePfasTotal" type="number" step="0.001"></label>
   <label style="grid-column:1/-1">개별 PFAS<input id="ePfasIndividual"></label><label style="grid-column:1/-1">PFAS 비고<textarea id="ePfasRemarks"></textarea></label>
  </div></div>
  <div class="formcard"><h3>6. 시험성적서 및 증빙자료</h3><div class="formgrid">
   <label>시험기관<input id="eLab"></label><label>성적서 번호<input id="eReport"></label><label>발행일<input id="eIssue" type="date"></label>
   <label style="grid-column:1/-1">비고<textarea id="eRemarks"></textarea></label>
  </div>
  <div id="existingFiles" class="files" style="margin-top:12px"></div>
  <div class="formgrid" style="margin-top:12px">
   <label>중금속 자료 추가<input id="fHeavy" type="file" multiple></label><label>PFAS 자료 추가<input id="fPfas" type="file" multiple></label>
   <label>DoC 추가<input id="fDoc" type="file" multiple></label><label>기타 자료 추가<input id="fOther" type="file" multiple></label>
  </div></div>
 </div>
 <div class="actions"><button id="saveEdit" class="primary">수정내용 저장</button><button id="cancelEdit" class="secondary">취소</button></div>
 <div id="editStatus" class="status" style="padding:0 16px 16px"></div>
</div></div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://husxmsxbhdalmubabfbv.supabase.co","sb_publishable_eTDBSThdDcMahPfXeadm8g_N0wBGHSS");
const TABLE="ppwr_submissions",BUCKET="ppwr-files";
const $=id=>document.getElementById(id), A=v=>Array.isArray(v)?v:[], esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let rows=[],view=[],editing=null,editFiles=[];
const pw=()=>{const p=prompt("비밀번호를 입력해 주세요.");if(p===null)return false;if(p!=="1234"){alert("비밀번호가 올바르지 않습니다.");return false}return true};
const spec=r=>A(r.specifications)[0]||{};
const review=r=>r.quality_review_status||"미검증";
const badge=(v,bad="부적합")=>`<span class="badge ${v==="적합"?"good":v===bad||v==="반려"?"bad":"neutral"}">${esc(v||"미입력")}</span>`;
function updateStats(){
 $("total").textContent=rows.length;$("companies").textContent=new Set(rows.map(r=>r.company).filter(Boolean)).size;
 $("hmOk").textContent=rows.filter(r=>r.heavy_metals_assessment==="적합").length;$("hmBad").textContent=rows.filter(r=>r.heavy_metals_assessment==="부적합").length;
 $("reviewPending").textContent=rows.filter(r=>!r.quality_review_status).length;$("reviewOk").textContent=rows.filter(r=>r.quality_review_status==="적합").length;$("reviewReject").textContent=rows.filter(r=>r.quality_review_status==="반려").length;
}
function apply(){
 const q=$("search").value.trim().toLowerCase(),hf=$("hmFilter").value,rf=$("reviewFilter").value;
 view=rows.filter(r=>{
  const sp=spec(r),text=[r.submission_id,r.company,r.major_category,r.packaging_type,sp.size,sp.code].join(" ").toLowerCase();
  const hm=r.heavy_metals_assessment||"미입력";
  return (!q||text.includes(q))&&(!hf||hm===hf)&&(!rf||review(r)===rf);
 });render();
}
function details(r){
 const mats=A(r.materials).map((m,i)=>`${i+1}. ${esc(m.material||"-")} / ${esc(m.component||"-")} / 구성비 ${esc(m.composition??"-")}% / 재생원료 ${esc(m.recycled??"-")}%`).join("<br>")||"-";
 const fs=A(r.uploaded_files).map((f,i)=>`<div class="file"><span>${esc(f.storedName||f.storedName||f.originalName||f.path)}</span><button class="secondary fileDownload" data-path="${esc(f.path||"")}">열기</button></div>`).join("")||"<span class=muted>첨부파일 없음</span>";
 return `<div class="grid">
 <div class="section"><h3>협력사 정보</h3><div class="kv"><b>업체명</b><span>${esc(r.company)}</span><b>담당자</b><span>${esc(r.contact_person)}</span><b>이메일</b><span>${esc(r.email)}</span><b>연락처</b><span>${esc(r.phone)}</span></div></div>
 <div class="section"><h3>포장재 정보</h3><div class="kv"><b>대분류</b><span>${esc(r.major_category)}</span><b>세부 품목군</b><span>${esc(r.packaging_type)}</span><b>대표 규격</b><span>${esc(spec(r).size)}</span><b>대표 품번</b><span>${esc(spec(r).code)}</span></div></div>
 <div class="section full"><h3>구성재질</h3>${mats}</div>
 <div class="section"><h3>중금속</h3><div class="kv"><b>Pb</b><span>${esc(r.lead_pb)}</span><b>Cd</b><span>${esc(r.cadmium_cd)}</span><b>Hg</b><span>${esc(r.mercury_hg)}</span><b>CrVI</b><span>${esc(r.chromium_vi)}</span><b>합계</b><span>${esc(r.heavy_metals_total)}</span><b>판정</b><span>${badge(r.heavy_metals_assessment)}</span></div></div>
 <div class="section"><h3>PFAS / 시험정보</h3><div class="kv"><b>PFAS 적용</b><span>${esc(r.pfas_applicable)}</span><b>Total</b><span>${esc(r.pfas_total)}</span><b>시험기관</b><span>${esc(r.laboratory)}</span><b>성적서</b><span>${esc(r.report_no)}</span><b>발행일</b><span>${esc(r.issue_date)}</span></div></div>
 <div class="section full"><h3>첨부파일</h3><div class="files">${fs}</div></div>
 <div class="section full review"><h3>적합성 검증</h3><label><input type="radio" name="rv_${esc(r.submission_id)}" value="적합" ${r.quality_review_status==="적합"?"checked":""}> 적합</label> &nbsp; <label><input type="radio" name="rv_${esc(r.submission_id)}" value="반려" ${r.quality_review_status==="반려"?"checked":""}> 반려</label><textarea class="rejectReason" placeholder="반려 사유">${esc(r.quality_rejection_reason||"")}</textarea><button class="primary saveReview" style="margin-top:8px">적합성 검증 저장</button></div>
 </div>`;
}
function render(){
 $("tbody").innerHTML="";
 view.forEach((r,i)=>{
  const sp=spec(r),tr=document.createElement("tr"),dr=document.createElement("tr"),id="detail_"+i;
  tr.innerHTML=`<td><input class="rowCheck" type="checkbox" data-id="${esc(r.submission_id)}"></td><td class="mono">${esc(r.submission_id)}</td><td><b>${esc(r.company||"-")}</b><div class=muted>${esc(r.contact_person||"")}</div></td><td>${esc(r.major_category||"-")}<div class=muted>${esc(r.packaging_type||"")}</div></td><td>${esc(sp.size||"-")}<div class=muted>${esc(sp.code||"-")}</div></td><td>${badge(r.heavy_metals_assessment)}</td><td>${esc(r.pfas_applicable||"-")}</td><td>${badge(review(r),"반려")}</td><td>${A(r.uploaded_files).length}개</td><td><button class="secondary show">상세</button> <button class="primary edit">수정</button></td>`;
  dr.innerHTML=`<td colspan="10"><div id="${id}" class="detail">${details(r)}</div></td>`;
  $("tbody").append(tr,dr);
  tr.querySelector(".show").onclick=()=>$(id).classList.toggle("open");
  tr.querySelector(".edit").onclick=()=>openEdit(r);
  bindDetail(dr,r);
 });
 $("status").textContent=`전체 ${rows.length}건 / 현재 조회 ${view.length}건`;
}
function bindDetail(root,r){
 root.querySelectorAll(".fileDownload").forEach(b=>b.onclick=async()=>{const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(b.dataset.path,60);if(error)alert(error.message);else window.open(data.signedUrl,"_blank")});
 const save=root.querySelector(".saveReview");if(save)save.onclick=async()=>{if(!pw())return;const val=root.querySelector(`input[name="rv_${CSS.escape(r.submission_id)}"]:checked`)?.value;if(!val){alert("적합 또는 반려를 선택해 주세요.");return}const reason=root.querySelector(".rejectReason").value.trim();if(val==="반려"&&!reason){alert("반려 사유를 입력해 주세요.");return}const {error}=await sb.from(TABLE).update({quality_review_status:val,quality_rejection_reason:val==="반려"?reason:null,quality_reviewed_at:new Date().toISOString()}).eq("submission_id",r.submission_id);if(error)alert(error.message);else load()};
}
async function load(){
 $("status").textContent="데이터를 불러오는 중...";
 const {data,error}=await sb.from(TABLE).select("*").order("submission_id",{ascending:false});
 if(error){$("status").textContent="조회 실패: "+error.message;return}
 rows=data||[];updateStats();apply();
}
function addMat(m={}){
 const d=document.createElement("div");d.className="matrow";d.innerHTML=`<input class="mm" placeholder="재질" value="${esc(m.material||"")}"><input class="mc" placeholder="부위" value="${esc(m.component||"")}"><input class="mp" type="number" placeholder="구성비 %" value="${esc(m.composition??"")}"><input class="mr" type="number" placeholder="재생원료 %" value="${esc(m.recycled??"")}"><input class="mn" placeholder="비고" value="${esc(m.remarks||"")}"><button class="danger">삭제</button>`;d.querySelector("button").onclick=()=>d.remove();$("materialEditor").append(d)
}
function openEdit(r){
 if(!pw())return;editing=r;editFiles=A(r.uploaded_files).map(x=>({...x}));const sp=spec(r);
 [["eCompany",r.company],["eContact",r.contact_person],["eEmail",r.email],["ePhone",r.phone],["eMajor",r.major_category],["eType",r.packaging_type],["eSpec",sp.size],["eCode",sp.code],["ePb",r.lead_pb],["eCd",r.cadmium_cd],["eHg",r.mercury_hg],["eCr",r.chromium_vi],["ePfasApplicable",r.pfas_applicable],["ePfasTotal",r.pfas_total],["ePfasIndividual",r.pfas_individual],["ePfasRemarks",r.pfas_remarks],["eLab",r.laboratory],["eReport",r.report_no],["eIssue",r.issue_date],["eRemarks",r.remarks]].forEach(([id,v])=>$(id).value=v??"");
 $("materialEditor").innerHTML="";A(r.materials).forEach(addMat);drawEditFiles();$("editModal").classList.add("open")
}
function drawEditFiles(){
 $("existingFiles").innerHTML=editFiles.map((f,i)=>`<div class=file><span>${esc(f.storedName||f.originalName||f.path)}</span><button class="danger efDel" data-i="${i}">삭제</button></div>`).join("")||"<span class=muted>기존 첨부파일 없음</span>";
 $("existingFiles").querySelectorAll(".efDel").forEach(b=>b.onclick=async()=>{if(!pw())return;const f=editFiles[+b.dataset.i];if(f.path){const {error}=await sb.storage.from(BUCKET).remove([f.path]);if(error){alert(error.message);return}}editFiles.splice(+b.dataset.i,1);drawEditFiles()});
}
async function uploadNew(){
 for(const [cat,id] of [["heavy-metal","fHeavy"],["pfas","fPfas"],["doc","fDoc"],["other","fOther"]]){let n=0;for(const f of [...$(id).files]){n++;const clean=f.name.replace(/[^\w.\-가-힣]/g,"_"),path=`${editing.submission_id}/${cat}/관리자수정_${Date.now()}_${n}_${clean}`;const {error}=await sb.storage.from(BUCKET).upload(path,f);if(error)throw error;editFiles.push({category:cat,originalName:f.name,path,type:f.type,size:f.size})}}
}
$("saveEdit").onclick=async()=>{if(!editing||!pw())return;$("editStatus").textContent="저장 중...";try{await uploadNew();const num=id=>$(id).value===""?null:Number($(id).value),vals=[num("ePb"),num("eCd"),num("eHg"),num("eCr")],has=vals.some(v=>v!==null),total=has?vals.reduce((a,v)=>a+(v||0),0):null,mats=[...$("materialEditor").children].map(d=>({material:d.querySelector(".mm").value,component:d.querySelector(".mc").value,composition:d.querySelector(".mp").value,recycled:d.querySelector(".mr").value,remarks:d.querySelector(".mn").value}));
 const payload={company:$("eCompany").value,contact_person:$("eContact").value,email:$("eEmail").value,phone:$("ePhone").value,major_category:$("eMajor").value,packaging_type:$("eType").value,specifications:[{item:$("eType").value,size:$("eSpec").value,code:$("eCode").value}],materials:mats,lead_pb:vals[0],cadmium_cd:vals[1],mercury_hg:vals[2],chromium_vi:vals[3],heavy_metals_total:total,heavy_metals_assessment:total===null?null:(total<=100?"적합":"부적합"),pfas_applicable:$("ePfasApplicable").value,pfas_total:num("ePfasTotal"),pfas_individual:$("ePfasIndividual").value,pfas_remarks:$("ePfasRemarks").value,laboratory:$("eLab").value,report_no:$("eReport").value,issue_date:$("eIssue").value||null,remarks:$("eRemarks").value,uploaded_files:editFiles};
 const {error}=await sb.from(TABLE).update(payload).eq("submission_id",editing.submission_id);if(error)throw error;$("editModal").classList.remove("open");$("editStatus").textContent="";await load()}catch(e){$("editStatus").textContent="저장 실패: "+e.message}};
$("addMaterial").onclick=()=>addMat();$("closeEdit").onclick=$("cancelEdit").onclick=()=>$("editModal").classList.remove("open");
$("refresh").onclick=load;["search","hmFilter","reviewFilter"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",apply));
$("checkAll").onchange=e=>document.querySelectorAll(".rowCheck").forEach(c=>c.checked=e.target.checked);
$("deleteSelected").onclick=async()=>{const ids=[...document.querySelectorAll(".rowCheck:checked")].map(x=>x.dataset.id);if(!ids.length){alert("삭제할 건을 선택해 주세요.");return}if(!pw()||!confirm(`${ids.length}건을 삭제할까요?`))return;const {error}=await sb.from(TABLE).delete().in("submission_id",ids);if(error)alert(error.message);else load()};
$("csv").onclick=()=>{const H=["접수번호","회사명","담당자","대분류","품목군","대표규격","대표품번","중금속합계","중금속판정","PFAS","적합성검증","반려사유"],Q=v=>`"${String(v??"").replace(/"/g,'""')}"`,L=[H.map(Q).join(",")];view.forEach(r=>{const s=spec(r);L.push([r.submission_id,r.company,r.contact_person,r.major_category,r.packaging_type,s.size,s.code,r.heavy_metals_total,r.heavy_metals_assessment,r.pfas_applicable,review(r),r.quality_rejection_reason].map(Q).join(","))});const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent("\uFEFF"+L.join("\r\n"));a.download="PPWR_submissions.csv";a.click()};
await load();
</script>
