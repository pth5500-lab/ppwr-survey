<style>

.status{font-size:12px;color:#667085;margin:8px 0}.tablebox{overflow:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:10px;border-bottom:1px solid #e7ebf0;text-align:left;vertical-align:top;font-size:13px}th{background:#f8fafc;position:sticky;top:0;z-index:1}.mono{font-family:monospace}.muted{font-size:11px;color:#667085}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#dcfae6;color:#067647}.bad{background:#fee4e2;color:#b42318}.neutral{background:#f2f4f7;color:#475467}
.detail{display:none;background:#fbfcfe;padding:14px}.detail.open{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid #e4e7ec;background:#fff;border-radius:10px;padding:12px}.section h3{margin:0 0 9px;font-size:14px;color:var(--navy)}.full{grid-column:1/-1}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;padding:20px;overflow:auto}.modal.open{display:block}.modalbox{max-width:1050px;margin:auto;background:var(--bg);border-radius:14px;overflow:hidden}.modalhead{background:var(--navy);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:19px}.formbody{padding:16px}.formcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}.formcard h3{margin:0 0 12px;color:var(--navy)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid label{font-size:12px;font-weight:700}.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin-top:4px}.formgrid textarea{min-height:70px}.matrow{display:grid;grid-template-columns:1.3fr 1fr .8fr .8fr 1fr auto;gap:6px;margin-bottom:6px}.matrow input{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px}.actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}

.toolbar{border:0!important;box-shadow:0 3px 12px rgba(16,24,40,.05)!important;border-radius:13px!important;padding:12px!important}

<body>
<div class="wrap">
 <div class="head"><h1>PPWR 제출자료 관리</h1><p>Toray Advanced Materials Korea Inc. · Purchasing Planning Team</p></div>
 <div class="admin-shell">
  <div class="dashboard-hero">
    <div><div class="eyebrow">PPWR CONTROL CENTER</div><h1>포장재 제출·검증 현황</h1><p>협력사 자료 취합부터 적합성 검증까지 한 화면에서 관리합니다.</p></div>
    <button id="refreshTop" class="hero-refresh">↻ 데이터 새로고침</button>

</div>
<div class="card toolbar">
  <input id="search" placeholder="회사명, 품목군, 품번, 접수번호 검색">
  <select id="hmFilter"><option value="">중금속 전체</option><option>적합</option><option>부적합</option><option value="미입력">미입력</option></select>
  <select id="pfasFilter"><option value="">PFAS 전체</option><option>해당</option><option>비해당</option><option>미확인</option></select>
  <select id="reviewFilter"><option value="">적합성 검증 전체</option><option value="미검증">미검증</option><option>적합</option><option>반려</option></select>
  <button id="refresh" class="secondary">새로고침</button>
  <button id="csv" class="secondary">CSV 다운로드</button>
  <button id="deleteSelected" class="danger">선택 삭제</button>
 </div>
 <div id="status" class="status">불러오는 중...</div>
 <div class="card tablebox"><table>
  <thead><tr><th><input id="checkAll" type="checkbox"></th><th>접수번호</th><th>협력사</th><th>품목군</th><th>대표 규격 / 품번</th><th>중금속</th><th>PFAS</th><th>적합성 검증</th><th>첨부</th><th>관리</th></tr></thead>
  <tbody id="tbody"></tbody>
 </table></div>
</div>

<div id="editModal" class="modal"><div class="modalbox">
 <div class="modalhead"><h2>제출자료 수정</h2><button id="closeEdit">닫기</button></div>
 <div class="formbody">
  <div class="formcard"><h3>1. 협력사 정보</h3><div class="formgrid">
   <label>업체명<input id="eCompany"></label><label>담당자<input id="eContact"></label>
   <label>이메일<input id="eEmail"></label><label>연락처<input id="ePhone"></label>
  </div></div>
  <div class="formcard"><h3>2. 품목군</h3><div class="formgrid">
   <label>대분류<input id="eMajor"></label><label>세부 품목군<input id="eType"></label>
  </div></div>
  <div class="formcard"><h3>3. 대표 규격 및 품번</h3><div class="formgrid">
   <label>대표 규격<input id="eSpec" placeholder="예: 1,000 × 1,200 mm"></label>
   <label>대표 품번<input id="eCode" placeholder="예: EBG01001"></label>
  </div></div>
  <div class="formcard"><h3>4. 구성재질 및 재질별 증빙</h3><div id="materialEditor"></div><button id="addMaterial" class="secondary">+ 재질 추가</button></div>
  <div class="formcard"><h3>5. 규제물질</h3><div class="formgrid">
   <label>Pb (mg/kg)<input id="ePb" type="number" step="0.001"></label><label>Cd (mg/kg)<input id="eCd" type="number" step="0.001"></label>
   <label>Hg (mg/kg)<input id="eHg" type="number" step="0.001"></label><label>CrVI (mg/kg)<input id="eCr" type="number" step="0.001"></label>
   <label>PFAS 적용<input id="ePfasApplicable"></label><label>PFAS Total (mg/kg)<input id="ePfasTotal" type="number" step="0.001"></label>
   <label style="grid-column:1/-1">개별 PFAS<input id="ePfasIndividual"></label><label style="grid-column:1/-1">PFAS 비고<textarea id="ePfasRemarks"></textarea></label>
  </div></div>
  <div class="formcard"><h3>6. 시험성적서 및 증빙자료</h3><div class="formgrid">
   <label>시험기관<input id="eLab"></label><label>성적서 번호<input id="eReport"></label><label>발행일<input id="eIssue" type="date"></label>
   <label style="grid-column:1/-1">비고<textarea id="eRemarks"></textarea></label>
  </div>

   <label>중금속 자료 추가<input id="fHeavy" type="file" multiple></label><label>PFAS 자료 추가<input id="fPfas" type="file" multiple></label>
   <label>DoC 추가<input id="fDoc" type="file" multiple></label><label>기타 자료 추가<input id="fOther" type="file" multiple></label>
  </div></div>
 </div>

 <div id="editStatus" class="status" style="padding:0 16px 16px"></div>
</div></div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://husxmsxbhdalmubabfbv.supabase.co","sb_publishable_eTDBSThdDcMahPfXeadm8g_N0wBGHSS");
const TABLE="ppwr_submissions",BUCKET="ppwr-files";
const $=id=>document.getElementById(id), A=v=>Array.isArray(v)?v:[], esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let rows=[],view=[],editing=null,editFiles=[];

function safeFileToken(v){
  return String(v??"")
    .normalize("NFKC")
    .replace(/\s*\/\s*/g,"_")
    .replace(/&/g,"_")
    .replace(/[\\/:*?"<>|#%{}[\]~`]+/g,"_")
    .replace(/\s+/g,"_")
    .replace(/_+/g,"_")
    .replace(/^_+|_+$/g,"") || "NA";
}
function englishLabel(v){
  const raw=String(v??"").trim();
  const parts=raw.split(/\s*\/\s*/);
  return safeFileToken(parts.length>1 ? parts[parts.length-1] : raw);
}
function fileExt(name){return (String(name||"").match(/\.[A-Za-z0-9]+$/)||[""])[0].toLowerCase();}
function standardFileName(submissionId,packagingType,category,index=1,materialName="",materialIndex=0){
  const sid=safeFileToken(submissionId);
  const type=englishLabel(packagingType);
  const no=String(index).padStart(2,"0");
  if(category==="material-report"){
    return `${sid}_${type}_${englishLabel(materialName)}_Material${String(Number(materialIndex)+1).padStart(2,"0")}_Report${no}`;
  }
  const label={"heavy-metal":"HeavyMetal","pfas":"PFAS","doc":"DoC","other":"Other","product-photo":"Photo"}[category]||"File";
  return `${sid}_${type}_${label}${no}`;
}
const pw=()=>{const p=prompt("비밀번호를 입력해 주세요.");if(p===null)return false;if(p!=="1234"){ppwrMessage("비밀번호가 올바르지 않습니다.");return false}return true};
const spec=r=>A(r.specifications)[0]||{};
const review=r=>r.quality_review_status||"미검증";
const hmAssess=r=>{
  const raw=String(r.heavy_metals_assessment||"").trim();
  if(/^(pass|적합)/i.test(raw)) return "적합";
  if(/^(fail|부적합)/i.test(raw)) return "부적합";
  if(r.heavy_metals_total!==null && r.heavy_metals_total!==undefined && r.heavy_metals_total!=="")
    return Number(r.heavy_metals_total)<=100 ? "적합" : "부적합";
  return "미입력";
};
const pfasStatus=r=>{
  const raw=String(r.pfas_applicable||"").trim();
  if(/not\s*applicable|n\/a|비해당|해당\s*없음/i.test(raw)) return "비해당";
  if(/applicable|해당/i.test(raw)) return "해당";
  return "미확인";
};
const badge=(v,bad="부적합")=>`<span class="badge ${v==="적합"?"good":v===bad||v==="반려"?"bad":"neutral"}">${esc(v||"미입력")}</span>`;

function standardizedDownloadName(r,f){
  const files=A(r.uploaded_files),cat=String(f.category||"");
  const same=files.filter(x=>String(x.category||"")===cat && (cat!=="material-report" || Number(x.materialIndex)===Number(f.materialIndex)));
  const idx=Math.max(0,same.indexOf(f))+1;
  const mat=cat==="material-report" ? (A(r.materials)[Number(f.materialIndex)]?.material || f.materialName || "Material") : "";
  return standardFileName(r.submission_id,r.packaging_type,cat,idx,mat,f.materialIndex||0)+fileExt(f.originalName||f.storedName||f.path);
}
function updateStats(){
  // 기존 통계 카드 DOM은 대시보드 리디자인에서 제거됨.
  // 통계는 renderDashboard()에서 직접 계산합니다.
  return;
}
function apply(){
 const q=$("search").value.trim().toLowerCase(),hf=$("hmFilter").value,pf=$("pfasFilter").value,rf=$("reviewFilter").value;
 view=rows.filter(r=>{
  const sp=spec(r),text=[r.submission_id,r.company,r.major_category,r.packaging_type,sp.size,sp.code].join(" ").toLowerCase();
  const hm=hmAssess(r);
  return (!q||text.includes(q))&&(!hf||hm===hf)&&(!pf||pfasStatus(r)===pf)&&(!rf||review(r)===rf);
 });render();
}
function details(r){
 const allFiles=A(r.uploaded_files);
 const by=cat=>allFiles.filter(f=>String(f.category||"").toLowerCase()===cat);
 const fh=(files,empty="첨부파일 없음")=>files.length
   ? files.map(f=>`<div class="file"><span>${esc(f.storedName||f.originalName||f.path||"file")}</span><div class="file-actions"><button class="fileViewBtn fileDownload" data-path="${esc(f.path||"")}">👁 보기</button><button class="fileSaveBtn fileSave" data-path="${esc(f.path||"")}" data-name="${esc(standardizedDownloadName(r,f))}">↓ 저장</button></div></div>`).join("")
   : `<span class="muted">${esc(empty)}</span>`;
 const reports=by("material-report");
 const mats=A(r.materials);
 const matRows=mats.map((m,i)=>{
   const mf=reports.filter(f=>Number(f.materialIndex)===i);
   const names=mf.length?mf.map(f=>esc(f.storedName||f.originalName||f.path||"file")).join("<br>"):'<span class="muted">없음</span>';
   const buttons=mf.length?mf.map(f=>`<span class="material-file-actions"><button class="fileViewBtn fileDownload" data-path="${esc(f.path||"")}">👁 보기</button><button class="fileSaveBtn fileSave" data-path="${esc(f.path||"")}" data-name="${esc(standardizedDownloadName(r,f))}">↓ 저장</button></span>`).join(" "):"";
   return `<tr><td class="num">${i+1}</td><td>${esc(m.material||"-")}</td><td class="num">${esc(m.composition??"-")}</td><td class="num">${esc(m.recycled??"-")}</td><td>${esc(m.remarks||"-")}</td><td class="filecell">${names}<div style="margin-top:5px">${buttons}</div></td></tr>`;
 }).join("")||`<tr><td colspan="6" class="muted">구성재질 정보 없음</td></tr>`;
 const pfas=by("pfas"),doc=by("doc"),other=by("other"),photos=by("product-photo");
 const ps=typeof pfasStatus==="function"?pfasStatus(r):(r.pfas_applicable||"미확인");
 const hm=typeof hmAssess==="function"?hmAssess(r):(r.heavy_metals_assessment||"-");
 const kvtable=(rows)=>`<table class="detail-table"><tbody>${rows.map(x=>`<tr><th style="width:34%">${x[0]}</th><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;
 return `<div class="grid">
 <div class="section full" style="padding:10px 14px">
   <div class="copybar" style="margin:0">
     <div><b>상세정보 전체 복사</b><span class="muted" style="margin-left:8px">Excel / 메일 붙여넣기용</span></div>
     <div><button class="copy-btn copyAllDetail">전체 표 복사</button><span class="copy-all-msg copy-msg"></span></div>

 const H=["접수번호","회사명","담당자","이메일","연락처","대분류","세부 품목군","대표규격","대표품번","구성재질 상세","재질별 성적서","Pb","Cd","Hg","CrVI","중금속 합계","중금속 판정","PFAS 상태","PFAS Total","개별 PFAS","PFAS 비고","PFAS 성적서","제품 사진","DoC","기타 참고자료","적합성 검증","반려사유","검증일시","비고"];
 const Q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
 const files=(r,c)=>A(r.uploaded_files).filter(f=>String(f.category||"").toLowerCase()===c).map(f=>f.storedName||f.originalName||f.path||"").join(" | ");
 const mats=r=>A(r.materials).map((m,i)=>`${i+1}) ${m.material||""} / 부위:${m.component||""} / 구성비:${m.composition??""}% / 재생원료:${m.recycled??""}% / 비고:${m.remarks||""}`).join(" | ");
 const L=[H.map(Q).join(",")];
 rows.forEach(r=>{const sp=spec(r);L.push([r.submission_id,r.company,r.contact_person,r.email,r.phone,r.major_category,r.packaging_type,sp.size,sp.code,mats(r),files(r,"material-report"),r.lead_pb,r.cadmium_cd,r.mercury_hg,r.chromium_vi,r.heavy_metals_total,hmAssess(r),pfasStatus(r),r.pfas_total,r.pfas_individual,r.pfas_remarks,files(r,"pfas"),files(r,"product-photo"),files(r,"doc"),files(r,"other"),review(r),r.quality_rejection_reason,r.quality_reviewed_at,r.remarks].map(Q).join(","))});
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent("\uFEFF"+L.join("\r\n"));a.download="PPWR_All_Submissions.csv";document.body.appendChild(a);a.click();a.remove();
};
await load();
</script>
