<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPWR 제출자료 조회</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#e4e7ec;--accent:#173b66;--bad:#b42318;--good:#067647}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(16,24,40,.05)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.stat{padding:15px}.num{font-size:26px;font-weight:800}.lbl{font-size:12px;color:var(--muted)}
.toolbar{padding:13px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto auto auto;gap:9px;margin-bottom:14px}
input,select,button{font:inherit}input[type=text],select{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.secondary{background:#eef2f6;color:var(--accent)}
.delete{background:#fef3f2;color:var(--bad);border:1px solid #fecdca}.delete:disabled{opacity:.45;cursor:not-allowed}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}
th{background:#f9fafb;color:#475467;font-size:12px}.check{width:18px;height:18px;cursor:pointer}.mono{font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--muted)}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#ecfdf3;color:var(--good)}.bad{background:#fef3f2;color:var(--bad)}.neutral{background:#f2f4f7;color:#475467}
.main{cursor:pointer}.main:hover{background:#fbfcfe}.detailrow td{padding:0;background:#fafbfd}.detail{display:none;padding:16px}.detail.open{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px}.section h3{font-size:14px;margin:0 0 10px}
.kv{display:grid;grid-template-columns:145px 1fr;gap:7px 10px;font-size:12px}.kv b{color:#475467}.mini{min-width:0}.mini th,.mini td{font-size:11px;padding:7px}
.empty{text-align:center;padding:45px;color:var(--muted)}.status{font-size:12px;color:var(--muted);margin:8px 0}.files button{margin:3px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}

.reviewbox{margin-top:14px;padding:14px;border:1px solid #d0d5dd;border-radius:10px;background:#f8fafc}
.review-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.review-actions label{display:flex;align-items:center;gap:6px;font-weight:700}
.review-reason{width:100%;margin-top:10px;padding:10px;border:1px solid #d0d5dd;border-radius:8px;min-height:72px}
.review-save{margin-top:10px;background:#173b66;color:#fff}
.review-status{font-weight:800}


.editbox{margin-top:14px;padding:14px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}
.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.editgrid label{display:block;font-size:11px;font-weight:700;color:#475467;margin-bottom:4px}
.editgrid input,.editgrid select,.editgrid textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:7px}
.editgrid textarea{min-height:70px}
.edit-full{grid-column:1/-1}.edit-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.edit-files{margin-top:12px;padding-top:12px;border-top:1px solid #e4e7ec}
.edit-file-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
@media(max-width:700px){.editgrid{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div><h1>PPWR 제출자료 조회</h1><div class="sub">Toray Advanced Materials Korea Inc. · Purchasing Planning Team · v2026.08.18-2</div></div>
  <button id="refresh" class="secondary">새로고침</button>
 </div>
 <div class="stats">
  <div class="card stat"><div id="sTotal" class="num">-</div><div class="lbl">전체 제출건수</div></div>
  <div class="card stat"><div id="sCompany" class="num">-</div><div class="lbl">협력사 수</div></div>
  <div class="card stat"><div id="sOk" class="num">-</div><div class="lbl">중금속 적합</div></div>
  <div class="card stat"><div id="sPfas" class="num">-</div><div class="lbl">PFAS 해당</div></div>
  <div class="card stat"><div id="sFile" class="num">-</div><div class="lbl">첨부파일 수</div></div>
 </div>
 <div class="card toolbar">
  <input id="q" type="text" placeholder="회사명, 품목명, 접수번호 검색">
  <select id="major"><option value="">대분류 전체</option></select>
  <select id="assess"><option value="">중금속 판정 전체</option><option value="적합">적합</option><option value="부적합">부적합</option><option value="미입력">미입력</option></select>
  <select id="pfasFilter"><option value="">PFAS 전체</option><option value="해당">해당</option><option value="비해당">비해당</option><option value="미입력">미입력</option></select>
  <button id="csv" class="secondary">CSV 다운로드</button>
  <button id="del" class="delete" disabled>선택 삭제 (0건)</button>
  <button id="clear" class="secondary">필터 초기화</button>
 </div>
 <div id="status" class="status">데이터를 불러오는 중...</div>
 <div class="card tablewrap">
  <table>
   <thead><tr>
    <th style="width:48px;text-align:center"><input id="all" class="check" type="checkbox" title="전체 선택"></th>
    <th>접수번호</th><th>협력사</th><th>품목군</th><th>대표 품목/규격</th><th>구성재질</th><th>중금속</th><th>PFAS</th><th>적합성 검증</th><th>첨부</th><th>상세</th>
   </tr></thead>
   <tbody id="body"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">조회된 자료가 없습니다.</div>
 </div>
</div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://husxmsxbhdalmubabfbv.supabase.co";
const KEY="sb_publishable_eTDBSThdDcMahPfXeadm8g_N0wBGHSS";
const TABLE="ppwr_submissions", BUCKET="ppwr-files";
const sb=createClient(SUPABASE_URL,KEY);
const $=x=>document.getElementById(x);
const A=v=>Array.isArray(v)?v:[];
const E=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const N=v=>(v===null||v===undefined||v==="")?"-":Number(v).toLocaleString();
let rows=[],filtered=[],selected=new Set();

function dateFromId(id){const m=String(id||"").match(/^PPWR-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-/);return m?`${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}:${m[6]}`:""}
function cls(v){
 const s=String(v||"").trim().toLowerCase();
 if(!s)return "neutral";
 if(s.includes("부적합")||s.includes("non-compliant")||s.includes("noncompliant")||s.includes("fail"))return "bad";
 if(s.includes("적합")||s.includes("compliant")||s.includes("pass")||s==="ok")return "good";
 return "neutral";
}
function normAssess(v){
 const s=String(v||"").trim().toLowerCase();
 if(!s)return "미입력";
 if(s.includes("부적합")||s.includes("non-compliant")||s.includes("noncompliant")||s.includes("fail"))return "부적합";
 if(s.includes("적합")||s.includes("compliant")||s.includes("pass")||s==="ok")return "적합";
 return s;
}
function pfasState(r){
 const s=String(r.pfas_applicable||"").trim().toLowerCase();
 if(!s)return "미입력";
 if(s.includes("비해당")||s==="no"||s==="n"||s.includes("not applicable")||s==="n/a")return "비해당";
 if(s.includes("해당")||s==="yes"||s==="y"||s==="applicable")return "해당";
 return "미입력";
}
function fc(r){return A(r.uploaded_files).length}
function reviewBadge(r){
 const v=String(r.quality_review_status||"").trim();
 if(v==="적합") return '<span class="badge good">적합</span>';
 if(v==="반려") return '<span class="badge bad">반려</span>';
 return '<span class="badge neutral">미검증</span>';
}
function shortSpec(v){const a=A(v);if(!a.length)return"-";const x=a[0];return `${E(x.item||"-")}<br><span class="muted">${E(x.size||"")}${x.code?" · "+E(x.code):""}</span>${a.length>1?`<br><span class="muted">외 ${a.length-1}건</span>`:""}`}
function shortMat(v){const a=A(v).filter(x=>x?.material);if(!a.length)return"-";return a.slice(0,2).map(x=>`${E(x.material)}${x.composition!==""&&x.composition!=null?" "+E(x.composition)+"%":""}`).join("<br>")+(a.length>2?`<br><span class="muted">외 ${a.length-2}건</span>`:"")}

async function load(){
 $("status").textContent="데이터를 불러오는 중...";
 const {data,error}=await sb.from(TABLE).select("*").order("submission_id",{ascending:false});
 if(error){$("status").textContent="조회 실패: "+error.message;$("body").innerHTML="";return}
 rows=data||[]; selected.clear(); buildMajor(); apply(); $("status").textContent=`마지막 조회: ${new Date().toLocaleTimeString()}`;
}
function buildMajor(){const keep=$("major").value;const vals=[...new Set(rows.map(r=>r.major_category).filter(Boolean))].sort();$("major").innerHTML='<option value="">대분류 전체</option>'+vals.map(v=>`<option>${E(v)}</option>`).join("");$("major").value=keep}
function apply(){
 const q=$("q").value.trim().toLowerCase();
 const m=$("major").value;
 const a=$("assess").value;
 const pf=$("pfasFilter").value;

 filtered=rows.filter(r=>{
  const specs=A(r.specifications).map(x=>`${x.item||""} ${x.size||""} ${x.code||""}`).join(" ");
  const h=`${r.submission_id||""} ${r.company||""} ${r.contact_person||""} ${r.packaging_type||""} ${specs}`.toLowerCase();
  if(q&&!h.includes(q))return false;
  if(m&&r.major_category!==m)return false;

  const av=normAssess(r.heavy_metals_assessment);
  if(a&&av!==a)return false;

  const pv=pfasState(r);
  if(pf&&pv!==pf)return false;

  return true;
 });
 render();
}
function render(){
 $("sTotal").textContent=filtered.length;
 $("sCompany").textContent=new Set(filtered.map(r=>r.company).filter(Boolean)).size;
 $("sOk").textContent=filtered.filter(r=>normAssess(r.heavy_metals_assessment)==="적합").length;
 $("sPfas").textContent=filtered.filter(r=>pfasState(r)==="해당").length;
 $("sFile").textContent=filtered.reduce((n,r)=>n+fc(r),0);
 $("empty").style.display=filtered.length?"none":"block";const tb=$("body");tb.innerHTML="";
 filtered.forEach((r,i)=>{const did="d"+i;const tr=document.createElement("tr");tr.className="main";
 tr.innerHTML=`<td style="text-align:center"><input class="check rowcheck" type="checkbox" data-id="${E(r.submission_id)}"></td>
 <td><div class="mono">${E(r.submission_id)}</div><div class="muted">${E(dateFromId(r.submission_id))}</div></td>
 <td><b>${E(r.company||"-")}</b><br><span class="muted">${E(r.contact_person||"")}</span></td>
 <td>${E(r.major_category||"-")}<br><span class="muted">${E(r.packaging_type||"-")}</span></td>
 <td>${shortSpec(r.specifications)}</td><td>${shortMat(r.materials)}</td>
 <td><span class="badge ${cls(r.heavy_metals_assessment)}">${E(r.heavy_metals_assessment||"미입력")}</span><br><span class="muted">${N(r.heavy_metals_total)} mg/kg</span></td>
 <td>${E(r.pfas_applicable||"-")}<br><span class="muted">${r.pfas_total==null?"":E(r.pfas_total)+" mg/kg"}</span></td>
 <td>${reviewBadge(r)}</td><td>${fc(r)}개</td><td><button class="secondary detailbtn">보기</button></td>`;
 const dr=document.createElement("tr");dr.className="detailrow";dr.innerHTML=`<td colspan="11"><div id="${did}" class="detail">${details(r)}</div></td>`;
 tr.addEventListener("click",e=>{if(e.target.classList.contains("rowcheck"))return;$(did).classList.toggle("open")});
 const cb=tr.querySelector(".rowcheck");cb.checked=selected.has(r.submission_id);cb.addEventListener("click",e=>e.stopPropagation());cb.addEventListener("change",()=>{cb.checked?selected.add(r.submission_id):selected.delete(r.submission_id);selUI()});
 tb.append(tr,dr);bindFiles(dr);bindEdit(dr,r);bindReview(dr)});
 selUI()
}
function details(r){
 const specs=A(r.specifications),mats=A(r.materials),files=A(r.uploaded_files);
 const sr=specs.length?specs.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.item||"")}</td><td>${E(x.size||"")}</td><td>${E(x.code||"")}</td></tr>`).join(""):'<tr><td colspan="4">-</td></tr>';
 const mr=mats.length?mats.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.material||"")}</td><td>${E(x.component||"")}</td><td>${E(x.composition||"")}</td><td>${E(x.recycled||"")}</td><td>${E(x.remarks||"")}</td></tr>`).join(""):'<tr><td colspan="6">-</td></tr>';
 const fb=files.length?files.map(f=>`<button class="secondary file" data-path="${E(f.path)}" data-name="${E(f.originalName||"file")}">${E(f.category||"file")} · ${E(f.originalName||"파일")}</button>`).join(""):"-";
 return `<div class="grid"><div class="section"><h3>협력사 / 기본정보</h3><div class="kv"><b>접수번호</b><span class="mono">${E(r.submission_id)}</span><b>회사명</b><span>${E(r.company||"-")}</span><b>담당자</b><span>${E(r.contact_person||"-")}</span><b>이메일</b><span>${E(r.email||"-")}</span><b>연락처</b><span>${E(r.phone||"-")}</span><b>대분류</b><span>${E(r.major_category||"-")}</span><b>세부 품목군</b><span>${E(r.packaging_type||"-")}</span></div></div>
 <div class="section"><h3>유해물질 / 시험정보</h3><div class="kv"><b>Pb</b><span>${N(r.lead_pb)} mg/kg</span><b>Cd</b><span>${N(r.cadmium_cd)} mg/kg</span><b>Hg</b><span>${N(r.mercury_hg)} mg/kg</span><b>Cr(VI)</b><span>${N(r.chromium_vi)} mg/kg</span><b>중금속 합계</b><span>${N(r.heavy_metals_total)} mg/kg</span><b>판정</b><span>${E(r.heavy_metals_assessment||"-")}</span><b>PFAS 적용</b><span>${E(r.pfas_applicable||"-")}</span><b>PFAS Total</b><span>${N(r.pfas_total)} mg/kg</span><b>시험기관</b><span>${E(r.laboratory||"-")}</span><b>성적서 번호</b><span>${E(r.report_no||"-")}</span></div></div>
 <div class="section"><h3>납품 규격 (${specs.length}건)</h3><table class="mini"><tr><th>#</th><th>품목명</th><th>규격</th><th>코드</th></tr>${sr}</table></div>
 <div class="section"><h3>구성재질 (${mats.length}건)</h3><table class="mini"><tr><th>#</th><th>재질</th><th>부위</th><th>구성비%</th><th>재생%</th><th>비고</th></tr>${mr}</table></div>
 <div class="section" style="grid-column:1/-1"><h3>첨부파일 (${files.length}개)</h3><div class="files">${fb}</div><div class="filestatus status"></div></div>
 <div class="section" style="grid-column:1/-1"><h3>제출자료 수정</h3>
 <button class="edit-open secondary" data-submission="${E(r.submission_id)}">수정 / Edit</button>
 <div class="editbox" style="display:none" data-edit="${E(r.submission_id)}">
  <div class="editgrid">
   <div><label>업체명</label><input data-f="company" value="${E(r.company||"")}"></div>
   <div><label>담당자</label><input data-f="contact_person" value="${E(r.contact_person||"")}"></div>
   <div><label>이메일</label><input data-f="email" value="${E(r.email||"")}"></div>
   <div><label>연락처</label><input data-f="phone" value="${E(r.phone||"")}"></div>
   <div><label>대분류</label><input data-f="major_category" value="${E(r.major_category||"")}"></div>
   <div><label>세부 품목군</label><input data-f="packaging_type" value="${E(r.packaging_type||"")}"></div>
   <div><label>Pb (mg/kg)</label><input type="number" step="0.001" data-f="lead_pb" value="${E(r.lead_pb??"")}"></div>
   <div><label>Cd (mg/kg)</label><input type="number" step="0.001" data-f="cadmium_cd" value="${E(r.cadmium_cd??"")}"></div>
   <div><label>Hg (mg/kg)</label><input type="number" step="0.001" data-f="mercury_hg" value="${E(r.mercury_hg??"")}"></div>
   <div><label>CrVI (mg/kg)</label><input type="number" step="0.001" data-f="chromium_vi" value="${E(r.chromium_vi??"")}"></div>
   <div><label>PFAS 적용</label><input data-f="pfas_applicable" value="${E(r.pfas_applicable||"")}"></div>
   <div><label>PFAS Total (mg/kg)</label><input type="number" step="0.001" data-f="pfas_total" value="${E(r.pfas_total??"")}"></div>
   <div><label>시험기관</label><input data-f="laboratory" value="${E(r.laboratory||"")}"></div>
   <div><label>성적서 번호</label><input data-f="report_no" value="${E(r.report_no||"")}"></div>
   <div><label>발행일</label><input type="date" data-f="issue_date" value="${E(r.issue_date||"")}"></div>
   <div class="edit-full"><label>PFAS 개별값</label><input data-f="pfas_individual" value="${E(r.pfas_individual||"")}"></div>
   <div class="edit-full"><label>PFAS 비고</label><textarea data-f="pfas_remarks">${E(r.pfas_remarks||"")}</textarea></div>
   <div class="edit-full"><label>비고</label><textarea data-f="remarks">${E(r.remarks||"")}</textarea></div>
  </div>
  <div class="edit-files">
   <strong>첨부파일 관리</strong>
   <div class="existing-edit-files"></div>
   <div style="margin-top:10px"><label>새 첨부파일 추가</label>
    <input class="newfiles" type="file" multiple accept=".pdf,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.doc,.docx">
   </div>
   <div class="muted" style="margin-top:5px">기존 파일은 개별 삭제할 수 있고 새 파일을 추가할 수 있습니다.</div>
  </div>
  <div class="edit-actions">
   <button class="edit-save">수정내용 저장</button>
   <button class="edit-cancel secondary">취소</button>
  </div>
  <div class="status editmsg"></div>
 </div>
</div>
<div class="section" style="grid-column:1/-1"><h3>적합성 검증</h3>
  <div class="reviewbox" data-submission="${E(r.submission_id)}">
   <div class="review-actions">
    <label><input type="radio" name="review_${E(r.submission_id)}" value="적합" ${r.quality_review_status==="적합"?"checked":""}> 적합</label>
    <label><input type="radio" name="review_${E(r.submission_id)}" value="반려" ${r.quality_review_status==="반려"?"checked":""}> 반려</label>
    <span class="muted">미선택 시 미검증</span>
   </div>
   <textarea class="review-reason" placeholder="반려 사유를 입력해 주세요.">${E(r.quality_rejection_reason||"")}</textarea>
   <button class="review-save">적합성 검증 결과 저장</button>
   <div class="status reviewmsg"></div>
  </div>
 </div></div>`
}

function adminPassword(){
 const pw=prompt("관리자 비밀번호를 입력해 주세요.");
 if(pw===null)return false;
 if(pw!=="1234"){alert("비밀번호가 올바르지 않습니다.");return false}
 return true;
}
function safeUploadName(name){return String(name||"file").replace(/[^\w.\-가-힣]/g,"_")}
function bindEdit(root,r){
 const open=root.querySelector(".edit-open"), box=root.querySelector(".editbox");
 if(!open||!box)return;
 const fileArea=box.querySelector(".existing-edit-files");
 let files=A(r.uploaded_files).map(x=>({...x}));
 const drawFiles=()=>{
  fileArea.innerHTML=files.length?files.map((f,i)=>`<div class="edit-file-row"><span>${E(f.originalName||f.storedName||f.path||"file")}</span><button type="button" class="delete edit-file-delete" data-i="${i}">삭제</button></div>`).join(""):'<div class="muted" style="margin-top:8px">첨부파일 없음</div>';
  fileArea.querySelectorAll(".edit-file-delete").forEach(b=>b.onclick=async()=>{
   if(!adminPassword())return;
   const i=Number(b.dataset.i), f=files[i];
   if(!confirm("이 첨부파일을 삭제할까요?"))return;
   if(f?.path){const {error}=await sb.storage.from(BUCKET).remove([f.path]);if(error){alert("파일 삭제 실패: "+error.message);return}}
   files.splice(i,1); drawFiles();
   const {error}=await sb.from(TABLE).update({uploaded_files:files}).eq("submission_id",r.submission_id);
   if(error)alert("DB 반영 실패: "+error.message); else await load();
  });
 };
 drawFiles();
 open.onclick=()=>{if(!adminPassword())return;box.style.display="block";open.style.display="none"};
 box.querySelector(".edit-cancel").onclick=()=>{box.style.display="none";open.style.display=""};
 box.querySelector(".edit-save").onclick=async()=>{
  if(!adminPassword())return;
  const msg=box.querySelector(".editmsg");msg.textContent="저장 중...";
  const payload={};
  box.querySelectorAll("[data-f]").forEach(el=>{payload[el.dataset.f]=el.value===""?null:el.value});
  const nums=["lead_pb","cadmium_cd","mercury_hg","chromium_vi","pfas_total"];
  nums.forEach(k=>{if(payload[k]!==null)payload[k]=Number(payload[k])});
  const metals=nums.slice(0,4).map(k=>Number(payload[k]||0));
  if(metals.some(v=>v>0)||nums.slice(0,4).some(k=>payload[k]!==null)){
    payload.heavy_metals_total=metals.reduce((a,b)=>a+b,0);
    payload.heavy_metals_assessment=payload.heavy_metals_total<=100?"적합":"부적합";
  }else{payload.heavy_metals_total=null;payload.heavy_metals_assessment=null}

  const add=[...box.querySelector(".newfiles").files];
  for(let i=0;i<add.length;i++){
   const f=add[i], stored=`관리자추가_${Date.now()}_${i+1}_${safeUploadName(f.name)}`;
   const path=`${r.submission_id}/admin/${stored}`;
   const {error}=await sb.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type||undefined});
   if(error){msg.textContent="첨부파일 업로드 실패: "+error.message;return}
   files.push({category:"admin",originalName:f.name,storedName:stored,path,type:f.type||"",size:f.size});
  }
  payload.uploaded_files=files;
  const {error}=await sb.from(TABLE).update(payload).eq("submission_id",r.submission_id);
  if(error){msg.textContent="수정 실패: "+error.message;return}
  msg.textContent="수정되었습니다.";await load();
 };
}
function bindReview(root){
 const box=root.querySelector(".reviewbox"); if(!box)return;
 const reason=box.querySelector(".review-reason");
 const radios=[...box.querySelectorAll('input[type="radio"]')];
 const sync=()=>{const v=radios.find(x=>x.checked)?.value||"";reason.style.display=v==="반려"?"block":"none";};
 radios.forEach(x=>x.addEventListener("change",sync)); sync();
 box.querySelector(".review-save").addEventListener("click",async e=>{
  e.stopPropagation();
  const status=radios.find(x=>x.checked)?.value||"";
  const msg=box.querySelector(".reviewmsg");
  if(!status){msg.textContent="적합 또는 반려를 선택해 주세요.";return}
  if(status==="반려"&&!reason.value.trim()){msg.textContent="반려 사유를 입력해 주세요.";reason.focus();return}
  msg.textContent="저장 중...";
  const payload={
   quality_review_status:status,
   quality_rejection_reason:status==="반려"?reason.value.trim():null,
   quality_reviewed_at:new Date().toISOString()
  };
  const {error}=await sb.from(TABLE).update(payload).eq("submission_id",box.dataset.submission);
  if(error){msg.textContent="저장 실패: "+error.message;return}
  msg.textContent="검증 결과가 저장되었습니다.";
  await load();
 });
}
function bindFiles(root){root.querySelectorAll(".file").forEach(b=>b.addEventListener("click",async e=>{e.stopPropagation();const s=root.querySelector(".filestatus");s.textContent="파일 불러오는 중...";const {data,error}=await sb.storage.from(BUCKET).download(b.dataset.path);if(error){s.textContent="다운로드 실패: "+error.message;return}const u=globalThis.URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=b.dataset.name;a.click();setTimeout(()=>globalThis.URL.revokeObjectURL(u),3000);s.textContent=""}))}
function selUI(){const ids=filtered.map(r=>r.submission_id),n=ids.filter(id=>selected.has(id)).length;$("all").checked=ids.length>0&&n===ids.length;$("all").indeterminate=n>0&&n<ids.length;$("del").disabled=selected.size===0;$("del").textContent=`선택 삭제 (${selected.size}건)`}
$("all").addEventListener("change",()=>{filtered.forEach(r=>$("all").checked?selected.add(r.submission_id):selected.delete(r.submission_id));document.querySelectorAll(".rowcheck").forEach(c=>c.checked=$("all").checked);selUI()});
$("del").addEventListener("click",async()=>{if(!selected.size)return;const targets=rows.filter(r=>selected.has(r.submission_id));if(!confirm(`선택한 ${targets.length}건을 삭제하시겠습니까?\n데이터와 첨부파일이 함께 삭제되며 복구할 수 없습니다.`))return;const pw=prompt("삭제 비밀번호를 입력하세요.");if(pw===null)return;if(pw!=="1234"){alert("비밀번호가 올바르지 않습니다.");return}
 $("del").disabled=true;$("del").textContent="삭제 중...";
 const paths=targets.flatMap(r=>A(r.uploaded_files).map(f=>f?.path).filter(Boolean));if(paths.length){const {error}=await sb.storage.from(BUCKET).remove(paths);if(error){alert("첨부파일 삭제 실패: "+error.message);selUI();return}}
 const {error}=await sb.from(TABLE).delete().in("submission_id",[...selected]);if(error){alert("데이터 삭제 실패: "+error.message);selUI();return}selected.clear();alert(`${targets.length}건이 삭제되었습니다.`);await load()
});
$("refresh").addEventListener("click",load);$("q").addEventListener("input",apply);$("major").addEventListener("change",apply);$("assess").addEventListener("change",apply);$("pfasFilter").addEventListener("change",apply);
$("clear").addEventListener("click",()=>{$("q").value="";$("major").value="";$("assess").value="";$("pfasFilter").value="";apply()});
$("csv").addEventListener("click",()=>{
 try{
  const H=[
   "접수번호","제출일시","회사명","담당자","이메일","연락처","대분류","세부품목군",
   "납품규격 상세","구성재질 상세",
   "Pb (mg/kg)","Cd (mg/kg)","Hg (mg/kg)","CrVI (mg/kg)",
   "중금속합계 (mg/kg)","중금속판정",
   "PFAS 적용","PFAS Total (mg/kg)","개별 PFAS","PFAS 비고",
   "시험기관","성적서번호","발행일","첨부파일 상세","비고"
  ];
  const Q=v=>`"${String(v??"").replace(/"/g,'""').replace(/\r?\n/g," ")}"`;
  const L=[H.map(Q).join(",")];

  filtered.forEach(r=>{
   const specs=A(r.specifications).map((x,i)=>
    `${i+1}. 품목명:${x.item||"-"} / 규격:${x.size||"-"} / 코드:${x.code||"-"}`
   ).join(" | ");
   const materials=A(r.materials).map((x,i)=>
    `${i+1}. 재질:${x.material||"-"} / 부위:${x.component||"-"} / 구성비:${x.composition??"-"}% / 재생원료:${x.recycled??"-"}% / 비고:${x.remarks||"-"}`
   ).join(" | ");
   const files=A(r.uploaded_files).map((f,i)=>
    `${i+1}. ${f.category||"file"}: ${f.originalName||f.path||"-"}`
   ).join(" | ");

   L.push([
    r.submission_id,dateFromId(r.submission_id),r.company,r.contact_person,r.email,r.phone,
    r.major_category,r.packaging_type,specs,materials,
    r.lead_pb,r.cadmium_cd,r.mercury_hg,r.chromium_vi,
    r.heavy_metals_total,r.heavy_metals_assessment,
    r.pfas_applicable,r.pfas_total,r.pfas_individual,r.pfas_remarks,
    r.laboratory,r.report_no,r.issue_date,files,r.remarks
   ].map(Q).join(","));
  });

  // Data URI 방식: URL.createObjectURL을 전혀 사용하지 않음
  const csvText="\uFEFF"+L.join("\r\n");
  const dataUri="data:text/csv;charset=utf-8,"+encodeURIComponent(csvText);
  const a=document.createElement("a");
  a.href=dataUri;
  a.download=`PPWR_submissions_${new Date().toISOString().slice(0,10)}.csv`;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  a.remove();
 }catch(err){
  alert("CSV 다운로드 오류: "+(err?.message||err));
 }
});

await load();
</script>
</body></html>
